<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | escape }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Jungle Book Legion">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:image" content="https://www.junglebooklegion.com/imgs/jbl-link-preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Jungle Book Legion logo on black">
<meta name="twitter:card" content="summary_large_image">
<title>{{ page.title | escape }}</title>
<link rel="icon" type="image/png" href="/jbl-logo.png">
<link rel="stylesheet" href="/style.css?v={{ site.github.build_revision | default: "local" }}">
{% if page.canonical %}<link rel="canonical" href="{{ page.canonical }}">{% endif %}
{% if page.section == "production" %}<script type="module" src="/quote.js?v={{ site.github.build_revision | default: "local" }}"></script>{% endif %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% include site-header.html %}
{{ content }}
{% include site-footer.html %}
</body>
</html>
